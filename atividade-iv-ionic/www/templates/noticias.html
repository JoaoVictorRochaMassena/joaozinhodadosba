<ion-view view-title="Notícias e atividades"
  ><ion-content class="padding"
    ><div class="pagina">
      <p class="nota">Publicações fictícias para demonstração.</p>
      <label class="item item-input item-select"
        ><span class="input-label">Categoria</span
        ><select aria-label="Categoria" ng-model="filtro.categoria">
          <option value="">Todas</option>
          <option ng-repeat="categoria in categorias" value="{{categoria}}">
            {{categoria}}
          </option>
        </select></label
      >
      <div
        class="list card"
        ng-repeat="item in publicacoes | filter:{categoria:filtro.categoria}"
      >
        <div class="item item-text-wrap">
          <h2>{{item.titulo}}</h2>
          <p>{{item.data | date:'dd/MM/yyyy'}} — {{item.categoria}}</p>
        </div>
        <div class="item item-image">
          <img
            ng-src="{{item.imagem}}"
            alt="Ilustração de {{item.categoria}}"
          />
        </div>
        <a class="item item-icon-right" ui-sref="app.detalhe({id:item.id})"
          >Ler mais<i class="icon ion-chevron-right" aria-hidden="true"></i
        ></a>
      </div></div></ion-content
></ion-view>
