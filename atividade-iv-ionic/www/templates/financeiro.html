<ion-view view-title="Mensalidades"
  ><ion-content class="padding"
    ><div class="pagina financeiro">
      <p class="nota">
        Valores e códigos fictícios. Nenhum pagamento é realizado.
      </p>
      <label class="item item-input item-select"
        ><span class="input-label">Semestre letivo</span
        ><select
          aria-label="Semestre letivo"
          ng-model="filtro.semestre"
          ng-change="carregar()"
          ng-options="s for s in semestres"
        ></select
      ></label>
      <div class="list card" ng-repeat="parcela in mensalidades">
        <div class="item item-text-wrap">
          <h2>Referência: {{parcela.mes}}</h2>
          <p>Vencimento: {{parcela.vencimento | date:'dd/MM/yyyy'}}</p>
          <p>{{parcela.valor | currency:'R$ ':2}}</p>
          <span
            class="badge"
            ng-class="{'badge-balanced':parcela.status==='Paga','badge-energized':parcela.status==='A Pagar'}"
            >{{parcela.status}}</span
          >
          <div ng-if="parcela.status==='A Pagar'">
            <code class="codigo">{{parcela.codigo}}</code
            ><button
              class="button button-positive button-block"
              ng-click="copiar(parcela)"
            >
              Copiar Código de Barras
            </button>
          </div>
        </div>
      </div>
    </div></ion-content
  ></ion-view
>
