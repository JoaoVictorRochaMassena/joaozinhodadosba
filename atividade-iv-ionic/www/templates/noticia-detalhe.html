<ion-view view-title="Publicação"
  ><ion-content class="padding"
    ><article class="pagina" ng-if="noticia">
      <h2>{{noticia.titulo}}</h2>
      <p>{{noticia.data | date:'dd/MM/yyyy'}} — {{noticia.categoria}}</p>
      <img
        class="ilustracao"
        ng-src="{{noticia.imagem}}"
        alt="Ilustração da publicação"
      />
      <p>{{noticia.texto}}</p>
      <a class="button button-positive" ui-sref="app.noticias"
        >Voltar ao mural</a
      >
    </article>
    <p ng-if="!noticia">Publicação não encontrada.</p></ion-content
  ></ion-view
>
