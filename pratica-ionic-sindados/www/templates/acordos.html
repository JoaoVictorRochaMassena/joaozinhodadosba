<ion-view view-title="ACTs e CCTs"><ion-nav-buttons side="left"><button class="button button-icon ion-navicon" menu-toggle="left" aria-label="Abrir menu"></button></ion-nav-buttons><ion-content class="padding"><div class="centro"><h2>Acordos e convenções</h2><div class="list card" ng-repeat="acordo in acordos"><div class="item item-text-wrap"><h3>{{acordo.tipo}} — {{acordo.titulo}}</h3><p>Vigência: {{acordo.vigencia}}</p><span class="badge" ng-class="{'badge-balanced':acordo.status==='Vigente','badge-energized':acordo.status==='Em negociação'}">{{acordo.status}}</span><button class="button button-small button-positive" ng-click="detalhes(acordo)">Ver cláusulas</button></div></div><p class="nota">Resumos simulados para esta atividade.</p></div></ion-content></ion-view>
